plugins {
	id 'java'
	id 'jacoco'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.kierenboal.npcsnap.NpcSnapPluginLauncher'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.kierenboal'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

test {
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass

    jvmArgs "-ea"
    if (providers.gradleProperty('disableHardwareAcceleration').isPresent()) {
        systemProperty 'sun.java2d.d3d', 'false'
        systemProperty 'sun.java2d.opengl', 'false'
        def localAppData = providers.environmentVariable('LOCALAPPDATA').orNull
        if (localAppData != null) {
            def runeLiteJava = new File(localAppData, 'RuneLite/jre/bin/java.exe')
            if (runeLiteJava.isFile()) {
                executable = runeLiteJava.absolutePath
            }
        }
    }

    args "--developer-mode", "--debug"
}

tasks.register('runWithProfiling', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    workingDir = projectDir

    def profileName = providers.gradleProperty('profileName')
        .getOrElse("2dscape-${System.currentTimeMillis()}.jfr")
    if (!(profileName ==~ /[A-Za-z0-9_.-]+\.jfr/)) {
        throw new GradleException('profileName must be a simple .jfr filename')
    }

    def profileFile = layout.buildDirectory.file("profiling/${profileName}").get().asFile
    doFirst {
        profileFile.parentFile.mkdirs()
    }

    jvmArgs '-ea', "-XX:StartFlightRecording=settings=profile,filename=${profileFile.absolutePath},dumponexit=true"
    args '--developer-mode', '--debug'
}

tasks.register('renderRetroHitsplatPreview', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.kierenboal.npcsnap.features.RetroHitsplatPreview'
	systemProperty 'java.awt.headless', 'true'
	args project.layout.buildDirectory.dir('reports/retro-hitsplats').get().asFile.absolutePath,
		project.findProperty('hitsplatPreviewName') ?: 'attempt-01',
		project.findProperty('rscHitsplatReference') ?: '',
		project.findProperty('hitsplatWikiDirectory') ?: 'tmp_wiki_page'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

if (findProject(':retroNpcSwapper') != null) {
    project(':retroNpcSwapper').afterEvaluate {
        project(':retroNpcSwapper').extensions.getByType(JavaPluginExtension).toolchain.languageVersion = JavaLanguageVersion.of(JavaVersion.current().majorVersion)

    }
    sourceSets {
        retroNpcCompat {
            compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            runtimeClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        }
    }
    dependencies {
        retroNpcCompatImplementation project(':retroNpcSwapper')
    }
    tasks.register('runWithRetroNpcSwapper', JavaExec) {
        classpath = sourceSets.retroNpcCompat.runtimeClasspath
        mainClass = 'com.kierenboal.npcsnap.RetroNpcCompatLauncher'
        jvmArgs '-ea'
        args '--developer-mode', '--debug', '--disable-telemetry'
    }
}
